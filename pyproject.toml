[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-fortigate"
version = "0.1.0"
description = "MCP server for FortiGate · read-only firewall access for LLM agents"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Otixe Cifuentes", email = "https://github.com/otixe" }]
keywords = ["mcp", "fortigate", "fortinet", "firewall", "claude", "anthropic", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.5",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "responses>=0.25",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-requests>=2.31",
]

[project.scripts]
mcp-fortigate = "mcp_fortigate.server:main"

[project.urls]
Homepage = "https://github.com/otixe/mcp-fortigate"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fortigate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MCP SDK decorators are untyped; suppress to keep strict elsewhere
module = ["mcp_fortigate.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
