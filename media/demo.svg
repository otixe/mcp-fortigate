<text x="28" y="78.0" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#65d8ba">$ </tspan><tspan fill="#8cf0d2">python client_demo.py   # MCP client -&gt; mcp-fortigate -&gt; synthetic FortiGate API</tspan></text><text x="28" y="100.5" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">tools: [&#x27;list_policies&#x27;, &#x27;get_policy&#x27;, &#x27;list_addresses&#x27;, &#x27;list_address_groups&#x27;, &#x27;audit_policy&#x27;]</tspan></text><text x="28" y="123.0" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">{</tspan></text><text x="28" y="145.4" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">  &quot;audited&quot;: 2,</tspan></text><text x="28" y="167.9" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">  &quot;policies_with_findings&quot;: 1,</tspan></text><text x="28" y="190.4" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">  &quot;results&quot;: {</tspan></text><text x="28" y="212.9" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">    &quot;7&quot;: [</tspan></text><text x="28" y="235.3" xml:space="preserve" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace' font-size="14.5"><tspan fill="#b9d2d5">      {</tspan></text><text x="28" y="257.8" xml:space="preserve" font-family='ui-monospace